services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=hometree'
      - 'POSTGRES_PASSWORD=hometree'
      - 'POSTGRES_USER=hometree'
    ports:
      - '5433:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    volumes:
      - 'redis-data:/data'

volumes:
  postgres-data:
  redis-data:
