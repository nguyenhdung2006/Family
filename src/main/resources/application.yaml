spring:
  application:
    name: hometree
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hometree}
    username: ${DB_USERNAME:hometree}
    password: ${DB_PASSWORD:hometree}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    type: ${CACHE_TYPE:simple}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
server:
  port: ${SERVER_PORT:8080}

hometree:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-production}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
    oauth-success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:3000/auth/callback}
    secure-cookies: ${SECURE_COOKIES:false}
  storage:
    cloudinary-cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    cloudinary-upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
    max-image-bytes: ${MAX_IMAGE_BYTES:10485760}
    max-video-bytes: ${MAX_VIDEO_BYTES:104857600}
