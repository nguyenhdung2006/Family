spring:
  application:
    name: hometree
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hometree}
    username: ${DB_USERNAME:hometree}
    password: ${DB_PASSWORD:hometree}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${SERVER_PORT:8080}

hometree:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
